<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 200px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #080808;
      color: #e0e0e0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo {
      color: #3b82f6;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    p {
      margin: 0;
      font-size: 12px;
      color: #888;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h2>Img<span class="logo">Ly</span></h2>
  <p>Select an image or container from this page to edit it visually.</p>
  <button id="pick-btn">Pick Element</button>
  <script src="popup.js"></script>
</body>
</html>
